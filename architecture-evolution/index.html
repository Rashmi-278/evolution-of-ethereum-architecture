<style>
  .main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 28px; align-items: start; margin-top: 14px; }
  @media (max-width: 1000px) { .main { grid-template-columns: 1fr; } }
  @media (max-width: 760px) {
    #dia { overflow-x: auto; margin: 0 -16px; padding: 0 16px; } #dia svg { min-width: 720px; max-height: none; }
    .panel h2 { font-size: 28px; }
  }
  #dia svg { width: 100%; height: auto; display: block; max-height: calc(100vh - 230px); }
  .panel h2 { font-size: 34px; line-height: 1.05; margin: 10px 0 2px; }
  .panel .sub { color: var(--dim); font: 13px var(--mono); }
  .panel h3 { font: 600 11px var(--mono); letter-spacing: .1em; color: var(--dim); margin: 22px 0 8px; text-transform: uppercase; }
  .panel ol { margin: 0; padding: 0; list-style: none; counter-reset: c; }
  .panel li { counter-increment: c; position: relative; padding-left: 30px; margin: 0 0 10px; font-size: 16px; line-height: 1.4; }
  .panel li::before { content: counter(c); position: absolute; left: 0; top: 1px; width: 20px; height: 20px; border-radius: 50%; background: var(--bg2); color: var(--brand); font: 600 11px/20px var(--mono); text-align: center; }
  .why { font-size: 16px; color: var(--brand-dark); font-weight: 500; }
  .ctl { display: flex; gap: 8px; margin-top: 22px; flex-wrap: wrap; }
  .more { font-size: 13px; color: var(--dim); margin-top: 14px; }
  .fade { animation: fade .45s ease; }
  @keyframes fade { from { opacity: .15; } to { opacity: 1; } }
  /* diagram */
  .b rect.box { fill: #FFFFFF; stroke: var(--line2); stroke-width: 1.2; transition: fill .4s, stroke .4s; }
  .b .lab { fill: var(--dim); font: 600 11.5px var(--mono); letter-spacing: .08em; }
  .b .txt { fill: var(--dim); font: 600 19px var(--sans); transition: fill .4s; }
  .b.hot rect.box { stroke-width: 2.2; }
  .b.new rect.box { stroke: var(--cyan); fill: #F2FDF5; } .b.new .txt { fill: var(--text); }
  .b.ch rect.box { stroke: var(--gold); fill: #F2EBFF; } .b.ch .txt { fill: var(--text); }
  .b.fut rect.box { stroke: var(--violet2); stroke-dasharray: 8 5; fill: #E5EFFF; } .b.fut .txt { fill: var(--text); }
  .b.res rect.box { stroke: var(--dim); stroke-dasharray: 2 5; fill: #F7F7F7; } .b.res .txt { fill: var(--text); }
  .b.off rect.box { fill: none; stroke: var(--line); stroke-dasharray: 3 6; } .b.off .txt { fill: var(--faint); }
  .badge rect { fill: var(--cyan); } .badge text { fill: #fff; font: 700 10px var(--mono); letter-spacing: .06em; }
  .b.ch .badge rect { fill: var(--brand); } .b.fut .badge rect { fill: var(--violet2); } .b.res .badge rect { fill: var(--dim); }
  .nodebox { fill: var(--bg1); stroke: var(--line2); stroke-width: 1.2; }
  .nodelab { fill: var(--text); font: 600 15px var(--sans); }
  .ln { stroke: var(--dim); stroke-width: 1.6; fill: none; }
  .lnl { fill: var(--dim); font: 500 12px var(--mono); }
  .sq { stroke-width: 1.2; transition: fill .4s; }
  .sq.t { fill: var(--brand); stroke: var(--brand); } .sq.m { fill: #DAC5FC; stroke: var(--brand); } .sq.e { fill: none; stroke: var(--line2); }
  .gas-bg { fill: var(--bg2); } .gas-fg { fill: var(--brand); transition: width .6s ease; }
  .meta { fill: var(--dim); font: 500 12px var(--mono); }
</style>
