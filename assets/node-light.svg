<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1130" width="1600" height="1130" font-family="Inter, DejaVu Sans, sans-serif" role="img" aria-label="Engineering view of an Ethereum node: execution client, consensus client, validator client, their interfaces, ports and networks.">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"/></marker></defs>
<rect width="1600" height="1130" fill="#FFFFFF"/>
<text x="40" y="44" font-size="26" font-weight="700" fill="#2C2C2A" text-anchor="start">Ethereum node: engineering view</text>
<text x="40" y="70" font-size="13.5" font-weight="400" fill="#5F5E5A" text-anchor="start">Post-Merge architecture as on mainnet after Fusaka (Nov 2026). Ports are client defaults. Based on Mastering Ethereum 2nd ed., ch3, ch14, ch15, ch16.</text>
<rect x="40" y="96" width="300" height="70" rx="14" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/>
<text x="56" y="122" font-size="15" font-weight="600" fill="#712B13" text-anchor="start">Wallets, dApps, indexers</text>
<text x="56" y="143" font-size="12.5" font-weight="400" fill="#993C1D" text-anchor="start">Send txs, read state</text>
<rect x="840" y="96" width="420" height="160" rx="14" fill="#FBEAF0" stroke="#993556" stroke-width="1.2"/>
<text x="856" y="122" font-size="15" font-weight="600" fill="#72243E" text-anchor="start">Validator client</text>
<text x="856" y="143" font-size="12.5" font-weight="400" fill="#993556" text-anchor="start">Holds the staker&#x27;s keys. Never touches the EL.</text>
<rect x="860" y="150" width="190" height="44" rx="8" fill="#FFFFFF" stroke="#993556" stroke-width="1"/>
<text x="876" y="176" font-size="13" font-weight="600" fill="#72243E" text-anchor="start">Duty scheduler</text>
<rect x="1060" y="150" width="180" height="44" rx="8" fill="#FFFFFF" stroke="#993556" stroke-width="1"/>
<text x="1076" y="176" font-size="13" font-weight="600" fill="#72243E" text-anchor="start">BLS signer</text>
<rect x="860" y="202" width="380" height="44" rx="8" fill="#FFFFFF" stroke="#993556" stroke-width="1"/>
<text x="876" y="228" font-size="13" font-weight="600" fill="#72243E" text-anchor="start">Slashing protection DB (EIP-3076)</text>
<rect x="1300" y="96" width="260" height="62" rx="14" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="1316" y="122" font-size="15" font-weight="600" fill="#712B13" text-anchor="start">Relays + builders</text>
<text x="1316" y="143" font-size="12.5" font-weight="400" fill="#993C1D" text-anchor="start">Off-protocol block market</text>
<rect x="1300" y="180" width="260" height="62" rx="14" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="1316" y="206" font-size="15" font-weight="600" fill="#712B13" text-anchor="start">MEV-Boost sidecar</text>
<text x="1316" y="227" font-size="12.5" font-weight="400" fill="#993C1D" text-anchor="start">Builder API, :18550</text>
<line x1="1430" y1="158" x2="1430" y2="178" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
<rect x="40" y="300" width="720" height="462" rx="14" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
<text x="56" y="326" font-size="15" font-weight="600" fill="#085041" text-anchor="start">Execution client</text>
<rect x="60" y="346" width="330" height="78" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
<text x="76" y="372" font-size="15" font-weight="600" fill="#085041" text-anchor="start">JSON-RPC server</text>
<text x="76" y="393" font-size="12.5" font-weight="400" fill="#0F6E56" text-anchor="start">:8545 HTTP · :8546 WS</text>
<text x="76" y="410" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="start" font-family="JetBrains Mono, DejaVu Sans Mono, monospace">eth_ · net_ · debug_</text>
<rect x="410" y="346" width="330" height="78" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
<text x="426" y="372" font-size="15" font-weight="600" fill="#085041" text-anchor="start">Engine API server</text>
<text x="426" y="393" font-size="12.5" font-weight="400" fill="#0F6E56" text-anchor="start">:8551 · JWT-authenticated</text>
<text x="426" y="410" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="start" font-family="JetBrains Mono, DejaVu Sans Mono, monospace">only the CL may call it</text>
<rect x="60" y="436" width="330" height="78" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
<text x="76" y="462" font-size="15" font-weight="600" fill="#085041" text-anchor="start">Txpool + blobpool</text>
<text x="76" y="483" font-size="12.5" font-weight="400" fill="#0F6E56" text-anchor="start">Pending txs, ordered by tip</text>
<text x="76" y="500" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="start" font-family="JetBrains Mono, DejaVu Sans Mono, monospace">blob txs carry cell proofs</text>
<rect x="410" y="436" width="330" height="78" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
<text x="426" y="462" font-size="15" font-weight="600" fill="#085041" text-anchor="start">Block processor + EVM</text>
<text x="426" y="483" font-size="12.5" font-weight="400" fill="#0F6E56" text-anchor="start">Runs txs, charges gas</text>
<text x="426" y="500" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="start" font-family="JetBrains Mono, DejaVu Sans Mono, monospace">writes receipts + logs</text>
<rect x="60" y="526" width="330" height="78" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
<text x="76" y="552" font-size="15" font-weight="600" fill="#085041" text-anchor="start">Payload builder</text>
<text x="76" y="573" font-size="12.5" font-weight="400" fill="#0F6E56" text-anchor="start">Builds a block when CL asks</text>
<text x="76" y="590" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="start" font-family="JetBrains Mono, DejaVu Sans Mono, monospace">picks txs by priority fee</text>
<rect x="410" y="526" width="330" height="78" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
<text x="426" y="552" font-size="15" font-weight="600" fill="#085041" text-anchor="start">State</text>
<text x="426" y="573" font-size="12.5" font-weight="400" fill="#0F6E56" text-anchor="start">Merkle-Patricia trie + snapshot</text>
<text x="426" y="590" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="start" font-family="JetBrains Mono, DejaVu Sans Mono, monospace">state root = 32-byte hash</text>
<rect x="60" y="616" width="680" height="58" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
<text x="76" y="642" font-size="15" font-weight="600" fill="#085041" text-anchor="start">Database: Pebble / LevelDB / MDBX  +  ancient store (old blocks)</text>
<text x="76" y="663" font-size="12.5" font-weight="400" fill="#0F6E56" text-anchor="start">State trie nodes, blocks, receipts. Pre-Merge history pruned in 2025.</text>
<rect x="60" y="688" width="680" height="58" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
<text x="76" y="714" font-size="15" font-weight="600" fill="#085041" text-anchor="start">devp2p stack: discv4 / discv5 · RLPx · eth/69 · snap/1   (:30303 TCP + UDP)</text>
<text x="76" y="735" font-size="12.5" font-weight="400" fill="#0F6E56" text-anchor="start">Gossips txs, serves block bodies and state for snap sync.</text>
<rect x="840" y="300" width="720" height="462" rx="14" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
<text x="856" y="326" font-size="15" font-weight="600" fill="#3C3489" text-anchor="start">Consensus client (beacon node)</text>
<rect x="860" y="346" width="330" height="78" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
<text x="876" y="372" font-size="15" font-weight="600" fill="#3C3489" text-anchor="start">Engine API client</text>
<text x="876" y="393" font-size="12.5" font-weight="400" fill="#534AB7" text-anchor="start">Drives the EL</text>
<text x="876" y="410" font-size="12" font-weight="400" fill="#534AB7" text-anchor="start" font-family="JetBrains Mono, DejaVu Sans Mono, monospace">forkchoiceUpdated · newPayload</text>
<rect x="1210" y="346" width="330" height="78" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
<text x="1226" y="372" font-size="15" font-weight="600" fill="#3C3489" text-anchor="start">Beacon API (REST)</text>
<text x="1226" y="393" font-size="12.5" font-weight="400" fill="#534AB7" text-anchor="start">:5052 (Lighthouse) · :3500 (Prysm)</text>
<text x="1226" y="410" font-size="12" font-weight="400" fill="#534AB7" text-anchor="start" font-family="JetBrains Mono, DejaVu Sans Mono, monospace">serves the validator client</text>
<rect x="860" y="436" width="330" height="78" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
<text x="876" y="462" font-size="15" font-weight="600" fill="#3C3489" text-anchor="start">Fork choice</text>
<text x="876" y="483" font-size="12.5" font-weight="400" fill="#534AB7" text-anchor="start">LMD-GHOST picks the head</text>
<text x="876" y="500" font-size="12" font-weight="400" fill="#534AB7" text-anchor="start" font-family="JetBrains Mono, DejaVu Sans Mono, monospace">Casper FFG finalizes</text>
<rect x="1210" y="436" width="330" height="78" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
<text x="1226" y="462" font-size="15" font-weight="600" fill="#3C3489" text-anchor="start">State transition</text>
<text x="1226" y="483" font-size="12.5" font-weight="400" fill="#534AB7" text-anchor="start">Beacon state, SSZ, 32-slot epochs</text>
<text x="1226" y="500" font-size="12" font-weight="400" fill="#534AB7" text-anchor="start" font-family="JetBrains Mono, DejaVu Sans Mono, monospace">rewards · penalties · slashing</text>
<rect x="860" y="526" width="330" height="78" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
<text x="876" y="552" font-size="15" font-weight="600" fill="#3C3489" text-anchor="start">Sync</text>
<text x="876" y="573" font-size="12.5" font-weight="400" fill="#534AB7" text-anchor="start">Checkpoint sync from a trusted root</text>
<text x="876" y="590" font-size="12" font-weight="400" fill="#534AB7" text-anchor="start" font-family="JetBrains Mono, DejaVu Sans Mono, monospace">backfills history</text>
<rect x="1210" y="526" width="330" height="78" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
<text x="1226" y="552" font-size="15" font-weight="600" fill="#3C3489" text-anchor="start">Blob / data column store</text>
<text x="1226" y="573" font-size="12.5" font-weight="400" fill="#534AB7" text-anchor="start">PeerDAS: custody some columns</text>
<text x="1226" y="590" font-size="12" font-weight="400" fill="#534AB7" text-anchor="start" font-family="JetBrains Mono, DejaVu Sans Mono, monospace">pruned after ~18 days</text>
<rect x="860" y="616" width="680" height="58" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
<text x="876" y="642" font-size="15" font-weight="600" fill="#3C3489" text-anchor="start">Database: beacon blocks, states, attestations</text>
<text x="876" y="663" font-size="12.5" font-weight="400" fill="#534AB7" text-anchor="start">Finalized states saved as checkpoints.</text>
<rect x="860" y="688" width="680" height="58" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
<text x="876" y="714" font-size="15" font-weight="600" fill="#3C3489" text-anchor="start">libp2p stack: discv5 · gossipsub · req/resp · SSZ + snappy   (:9000 TCP + UDP)</text>
<text x="876" y="735" font-size="12.5" font-weight="400" fill="#534AB7" text-anchor="start">Topics: beacon_block, beacon_attestation_N, data_column_sidecar_N.</text>
<line x1="742" y1="385" x2="858" y2="385" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="800" y="372" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle">Engine API</text>
<text x="800" y="406" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" font-family="JetBrains Mono, DejaVu Sans Mono, monospace">:8551</text>
<text x="800" y="421" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" font-family="JetBrains Mono, DejaVu Sans Mono, monospace">JWT</text>
<line x1="230" y1="168" x2="230" y2="344" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>
<text x="242" y="250" font-size="12.5" font-weight="600" fill="#2C2C2A" text-anchor="start">JSON-RPC</text>
<text x="242" y="267" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="start" font-family="JetBrains Mono, DejaVu Sans Mono, monospace">eth_sendRawTransaction</text>
<text x="242" y="283" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="start" font-family="JetBrains Mono, DejaVu Sans Mono, monospace">eth_call · eth_getLogs</text>
<line x1="1230" y1="258" x2="1230" y2="344" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="1220" y="274" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="end">REST: duties,</text>
<text x="1220" y="289" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="end">produce, publish</text>
<line x1="1500" y1="244" x2="1500" y2="344" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="1510" y="284" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">bids</text>
<rect x="40" y="800" width="720" height="62" rx="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
<text x="56" y="826" font-size="15" font-weight="600" fill="#2C2C2A" text-anchor="start">Execution P2P network</text>
<text x="56" y="847" font-size="12.5" font-weight="400" fill="#5F5E5A" text-anchor="start">Other nodes run Geth, Nethermind, Besu, Erigon, Reth (client diversity)</text>
<rect x="840" y="800" width="720" height="62" rx="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
<text x="856" y="826" font-size="15" font-weight="600" fill="#2C2C2A" text-anchor="start">Consensus P2P network</text>
<text x="856" y="847" font-size="12.5" font-weight="400" fill="#5F5E5A" text-anchor="start">Other nodes run Prysm, Lighthouse, Teku, Nimbus, Lodestar, Grandine</text>
<line x1="400" y1="764" x2="400" y2="798" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
<line x1="1200" y1="764" x2="1200" y2="798" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="40" y="906" font-size="16" font-weight="700" fill="#2C2C2A" text-anchor="start">Proposing a block, step by step (one 12-second slot)</text>
<rect x="40" y="922" width="243" height="86" rx="8" fill="#FFFFFF" stroke="#993556" stroke-width="1"/>
<text x="56" y="948" font-size="14" font-weight="600" fill="#72243E" text-anchor="start">1. Duty</text>
<text x="56" y="969" font-size="12.5" font-weight="400" fill="#993556" text-anchor="start">VC learns it owns this slot</text>
<text x="56" y="986" font-size="12" font-weight="400" fill="#993556" text-anchor="start" font-family="JetBrains Mono, DejaVu Sans Mono, monospace">via Beacon API</text>
<line x1="284" y1="965" x2="294" y2="965" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="295" y="922" width="243" height="86" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
<text x="311" y="948" font-size="14" font-weight="600" fill="#3C3489" text-anchor="start">2. Prepare</text>
<text x="311" y="969" font-size="12.5" font-weight="400" fill="#534AB7" text-anchor="start">CL → EL: forkchoiceUpdated</text>
<text x="311" y="986" font-size="12" font-weight="400" fill="#534AB7" text-anchor="start" font-family="JetBrains Mono, DejaVu Sans Mono, monospace">+ payload attributes</text>
<line x1="539" y1="965" x2="549" y2="965" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="550" y="922" width="243" height="86" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
<text x="566" y="948" font-size="14" font-weight="600" fill="#3C3489" text-anchor="start">3. Get block</text>
<text x="566" y="969" font-size="12.5" font-weight="400" fill="#534AB7" text-anchor="start">EL getPayload, or a</text>
<text x="566" y="986" font-size="12" font-weight="400" fill="#534AB7" text-anchor="start" font-family="JetBrains Mono, DejaVu Sans Mono, monospace">MEV-Boost bid if higher</text>
<line x1="794" y1="965" x2="804" y2="965" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="805" y="922" width="243" height="86" rx="8" fill="#FFFFFF" stroke="#993556" stroke-width="1"/>
<text x="821" y="948" font-size="14" font-weight="600" fill="#72243E" text-anchor="start">4. Sign</text>
<text x="821" y="969" font-size="12.5" font-weight="400" fill="#993556" text-anchor="start">VC checks slashing DB,</text>
<text x="821" y="986" font-size="12" font-weight="400" fill="#993556" text-anchor="start" font-family="JetBrains Mono, DejaVu Sans Mono, monospace">signs with BLS key</text>
<line x1="1049" y1="965" x2="1059" y2="965" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="1060" y="922" width="243" height="86" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
<text x="1076" y="948" font-size="14" font-weight="600" fill="#3C3489" text-anchor="start">5. Gossip</text>
<text x="1076" y="969" font-size="12.5" font-weight="400" fill="#534AB7" text-anchor="start">CL broadcasts block</text>
<text x="1076" y="986" font-size="12" font-weight="400" fill="#534AB7" text-anchor="start" font-family="JetBrains Mono, DejaVu Sans Mono, monospace">+ data column sidecars</text>
<line x1="1304" y1="965" x2="1314" y2="965" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="1315" y="922" width="243" height="86" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
<text x="1331" y="948" font-size="14" font-weight="600" fill="#085041" text-anchor="start">6. Verify</text>
<text x="1331" y="969" font-size="12.5" font-weight="400" fill="#0F6E56" text-anchor="start">Peers: newPayload → EL</text>
<text x="1331" y="986" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="start" font-family="JetBrains Mono, DejaVu Sans Mono, monospace">re-executes → VALID</text>
<text x="40" y="1040" font-size="12.5" font-weight="400" fill="#5F5E5A" text-anchor="start">Attestation path (every slot, for 1/32 of validators): VC gets duty → CL builds AttestationData from fork choice → VC signs → CL gossips on beacon_attestation_N.</text>
<text x="40" y="1060" font-size="12.5" font-weight="400" fill="#5F5E5A" text-anchor="start">Finality: when 2/3 of stake votes for two epochs in a row, Casper FFG finalizes the older checkpoint (about 12.8 minutes).</text>
<text x="40" y="1100" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="start">Legend:</text>
<rect x="100" y="1089" width="18" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="124" y="1100" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">Execution layer</text>
<rect x="259" y="1089" width="18" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/>
<text x="283" y="1100" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">Consensus layer</text>
<rect x="418" y="1089" width="18" height="14" rx="3" fill="#FBEAF0" stroke="#993556"/>
<text x="442" y="1100" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">Validator (keys)</text>
<rect x="584" y="1089" width="18" height="14" rx="3" fill="#FAECE7" stroke="#993C1D"/>
<text x="608" y="1100" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">External / off-protocol</text>
<rect x="799" y="1089" width="18" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="823" y="1100" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">P2P networks</text>
</svg>